url: https://raw.githubusercontent.com/api-evangelist/prometeo/refs/heads/main/apis.yml
name: Prometeo
kind: company
description: Prometeo is a LatAm-founded (Uruguay) fintech infrastructure company
  offering a single financial API over 7,500+ banking connections across the
  Americas. Products span banking data access, real-time account validation,
  cross-border pay-in / payout / FX, account-to-account payments, Mexican CURP
  identity, and fiscal data (DIAN / SAT / CEP / BCU). All products authenticate
  with an X-API-Key header and offer a mock-data sandbox.
